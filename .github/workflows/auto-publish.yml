name: Auto Publish AI Risk Blog

on:
  schedule:
    # Every 6 hours: 00:00, 06:00, 12:00, 18:00 UTC
    - cron: '0 0,6,12,18 * * *'
  workflow_dispatch:
    inputs:
      max_posts:
        description: 'Max posts to publish this run (overrides default)'
        required: false
        default: '3'

concurrency:
  group: auto-publish
  cancel-in-progress: false  # don't cancel a running publish — queue instead

permissions:
  contents: write

jobs:
  pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install root dependencies (pipeline)
        run: npm ci --ignore-scripts

      - name: Install site dependencies (Astro)
        run: cd site && npm ci

      - name: Run ingestion pipeline
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          IMAGE_API_URL: ${{ secrets.IMAGE_API_URL }}
          IMAGE_API_KEY: ${{ secrets.IMAGE_API_KEY }}
          IMAGE_MODEL: ${{ vars.IMAGE_MODEL || 'dall-e-2' }}
          MAX_POSTS_PER_RUN: ${{ github.event.inputs.max_posts || vars.MAX_POSTS_PER_RUN || '3' }}
        run: node --experimental-strip-types scripts/pipeline.ts

      - name: Build Astro site
        run: cd site && npm run build

      - name: Commit and push generated files
        run: |
          git config user.name  "AI Risk Blog Bot"
          git config user.email "bot@github-actions"
          git add site/src/content/posts/ content/ site/public/assets/memes/ || true
          if git diff --cached --quiet; then
            echo "No new content generated this run."
          else
            TIMESTAMP=$(date -u +"%Y-%m-%d %H:%M UTC")
            git commit -m "chore: auto-publish posts [${TIMESTAMP}]"
            git push
          fi
